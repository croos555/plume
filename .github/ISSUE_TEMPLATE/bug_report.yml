name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If a document is involved, attach a small sample that shows the problem
        (remove anything private first).
        Security issues: use [private vulnerability reporting](https://github.com/croos555/plume/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead (with the error message if any).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: version
    attributes:
      label: Plume version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Linux]
    validations:
      required: true
