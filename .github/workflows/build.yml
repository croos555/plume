name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      # Sign with the Developer ID certificate and notarize on release tags when the secrets exist
      SIGN_MAC: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CSC_LINK != '' && secrets.APPLE_API_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck

      # Own keychain, as in GitHub's docs for macOS runners; the Tauri CLI then finds the identity in it
      - name: Import the Developer ID certificate
        if: env.SIGN_MAC == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$MAC_CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          test -n "$IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      # notarytool reads the App Store Connect API key from a file: write it for the duration of the job
      - name: Prepare notarization key
        if: env.SIGN_MAC == 'true'
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      # One universal app (Apple Silicon + Intel). Without the secrets (forks, manual runs) nothing is signed.
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
        env:
          APPLE_API_KEY: ${{ env.SIGN_MAC == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.SIGN_MAC == 'true' && secrets.APPLE_API_ISSUER || '' }}

      - name: Verify macOS signature and notarization
        if: env.SIGN_MAC == 'true'
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Plume.app
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt
          xcrun stapler validate "$app"

      - name: Remove the notarization key and the signing keychain
        if: always() && env.SIGN_MAC == 'true'
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: plume-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04: an older glibc keeps the AppImage working on more distributions
        include:
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils file >/dev/null
      - run: npm ci
      - run: npm run typecheck
      - run: npx tauri build --bundles appimage,deb,rpm
      - uses: actions/upload-artifact@v4
        with:
          name: plume-Linux-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # The Windows installer is cross-compiled and signed on Linux: cargo-xwin provides the MSVC
  # toolchain, NSIS builds the installer and ssign signs through Certum's cloud API.
  build-windows:
    runs-on: ubuntu-24.04
    env:
      # Sign with the Certum cloud certificate on release tags when the secrets exist
      SIGN_WINDOWS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CERTUM_TOTP_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows
      - name: Install the cross-compilation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis lld llvm clang >/dev/null
          cargo install --locked cargo-xwin
      - run: npm ci
      - run: npm run typecheck

      # ssign signs through Certum's cloud API over HTTPS. Pinned release, checksum verified.
      - name: Install ssign and osslsigncode
        if: env.SIGN_WINDOWS == 'true'
        run: |
          curl -fsSL -o /tmp/ssign.tar.gz https://github.com/Le-Syl21/ssign/releases/download/v0.1.8/ssign-linux-x86_64.tar.gz
          echo "fc38f083ea1f061a097a3a9c5dc1a056c9c7310a47e40f56a8976895ec5a928d  /tmp/ssign.tar.gz" | sha256sum -c -
          sudo tar xzf /tmp/ssign.tar.gz -C /usr/local/bin ssign
          sudo apt-get install -y -qq osslsigncode >/dev/null

      # build/sign-win.sh signs the app and the installer when the Certum secrets are set
      - name: Build
        run: |
          if [ "$SIGN_WINDOWS" = "true" ]; then
            CONFIG="{\"bundle\":{\"windows\":{\"signCommand\":{\"cmd\":\"bash\",\"args\":[\"$GITHUB_WORKSPACE/build/sign-win.sh\",\"%1\"]}}}}"
            npx tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis --config "$CONFIG"
          else
            npx tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis
          fi
        env:
          CERTUM_EMAIL: ${{ env.SIGN_WINDOWS == 'true' && secrets.CERTUM_USERNAME || '' }}
          CERTUM_OTP: ${{ env.SIGN_WINDOWS == 'true' && secrets.CERTUM_TOTP_SECRET || '' }}

      - name: Verify Windows signatures
        if: env.SIGN_WINDOWS == 'true'
        run: |
          for f in src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe src-tauri/target/x86_64-pc-windows-msvc/release/plume.exe; do
            echo "== $f"
            osslsigncode verify -in "$f" -CAfile /etc/ssl/certs/ca-certificates.crt | tee /tmp/verify.txt
            grep -q "Signature verification: ok" /tmp/verify.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: plume-Windows
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          # v1.2.3-rc.1 and similar are published as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
