<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5bd6"/>
      <stop offset="1" stop-color="#2c2a7a"/>
    </linearGradient>
    <linearGradient id="vane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcdcf7"/>
    </linearGradient>
  </defs>

  <!-- macOS icon grid: 824px squircle inset 100px -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>

  <!-- ink line -->
  <path d="M 250 790 C 330 760, 380 800, 450 770" fill="none" stroke="#f5b84a" stroke-width="22" stroke-linecap="round"/>

  <!-- feather vane -->
  <path fill="url(#vane)" d="M 300 748 C 330 560, 420 380, 560 270 C 640 208, 730 190, 790 196 C 792 270, 760 380, 690 470 C 640 534, 560 590, 470 620 L 520 560 L 430 600 C 400 650, 360 700, 300 748 Z"/>
  <!-- notches -->
  <path d="M 640 470 L 700 455 M 560 560 L 610 552" stroke="#2c2a7a" stroke-opacity="0.18" stroke-width="16" stroke-linecap="round"/>
  <!-- shaft -->
  <path d="M 292 760 C 420 600, 560 420, 760 226" fill="none" stroke="#5b5bd6" stroke-width="18" stroke-linecap="round"/>
</svg>
