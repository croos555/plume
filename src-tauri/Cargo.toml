[package]
name = "plume"
version = "0.1.0"
description = "A friendly Markdown reader and editor with live preview"
authors = ["Christophe Roos"]
license = "MIT"
repository = "https://github.com/croos555/plume"
edition = "2021"
rust-version = "1.77"

[lib]
name = "plume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
base64 = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
# Small binaries: the whole point of using Tauri
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
